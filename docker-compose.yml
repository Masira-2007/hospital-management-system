services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: jr_xpert_hms
      POSTGRES_USER: jr_xpert
      POSTGRES_PASSWORD: jr_xpert_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jr_xpert -d jr_xpert_hms"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
  redis_data:
