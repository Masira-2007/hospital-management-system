name: CI

on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "docker/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "docker/**"
      - "prisma/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: jr_xpert_hms_test
          POSTGRES_USER: jr_xpert_test_owner
          POSTGRES_PASSWORD: jr_xpert_test_owner_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U jr_xpert_test_owner -d jr_xpert_hms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://jr_xpert_app:jr_xpert_app_test@127.0.0.1:5433/jr_xpert_hms_test?schema=public
      DIRECT_URL: postgresql://jr_xpert_test_owner:jr_xpert_test_owner_dev@127.0.0.1:5433/jr_xpert_hms_test?schema=public
      TENANT_ISOLATION_TEST_APP_URL: postgresql://jr_xpert_app:jr_xpert_app_test@127.0.0.1:5433/jr_xpert_hms_test?schema=public
      TENANT_ISOLATION_TEST_OWNER_URL: postgresql://jr_xpert_test_owner:jr_xpert_test_owner_dev@127.0.0.1:5433/jr_xpert_hms_test?schema=public
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run db:validate --workspace @jr-xpert/api
      - name: Prepare isolated runtime role
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec "$POSTGRES_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U jr_xpert_test_owner -d jr_xpert_hms_test -c "CREATE ROLE jr_xpert_app LOGIN PASSWORD 'jr_xpert_app_test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          docker exec "$POSTGRES_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U jr_xpert_test_owner -d jr_xpert_hms_test -c "CREATE DATABASE neondb"
          docker exec "$POSTGRES_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U jr_xpert_test_owner -d jr_xpert_hms_test -c "GRANT CONNECT ON DATABASE neondb TO jr_xpert_app"
      - run: npm run db:migrate:deploy --workspace @jr-xpert/api
      - run: npm run test:tenant-isolation --workspace @jr-xpert/api
      - run: npm run build
